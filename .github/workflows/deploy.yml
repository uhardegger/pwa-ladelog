# Build, verify and publish to GitHub Pages (PRD step 9).
#
# Pages is a prerequisite for the whole app: a service worker only registers
# over HTTPS, and without one there is no offline start (FR-3.3).
#
# The deployment is gated on the tests. An app whose worst failure mode is
# silent data loss (NFR-7) should not be able to ship a red build.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deployments race; queue instead of cancelling, so the last
# push always ends up being the one that is live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # Requires Pages to be switched on once by hand:
      #   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
      # The workflow token cannot create the Pages site itself; enabling it
      # from here was tried and still failed at this step.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
